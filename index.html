<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Fragments UI</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/water.css@2/out/water.css" />
    <script type="module" src="src/app.js"></script>
  </head>
  <body>
    <h1>Fragments UI</h1>
    <section>
      <nav>
        <button id="login">Login</button>
      </nav>
    </section>
    <section hidden id="user">
      <h2>Welcome <span class="username"></span>!</h2>
    </section>

    <section id="fragment-form" hidden>
      <h2>Create Fragment</h2>

      <form>
        <label for="fragment-type">Fragment Type:</label>

        <select id="fragment-type">
          <option value="text/plain">Plain Text</option>
          <option value="text/markdown">Markdown</option>
          <option value="application/json">JSON</option>
        </select>

        <br /><br />

        <textarea
          id="fragment-text"
          rows="6"
          placeholder="Enter fragment content here..."
        ></textarea>

        <br />

        <button type="submit">Create</button>
      </form>
    </section>

    <section id="fragments-section" hidden>
      <h2>Your Fragments</h2>

      <div id="fragments-list"></div>
    </section>
    
  </body>
</html>
